<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIFTS-POWERS 管理后台</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#070b14;color:#e2e8f0;font-family:Inter,system-ui,sans-serif}.panel{background:#0d1424;border:1px solid #243044;border-radius:18px}.field{background:#080f1d;border:1px solid #334155;border-radius:9px;padding:10px;width:100%;color:#e2e8f0}.btn{background:linear-gradient(90deg,#06b6d4,#2563eb);color:#020617;font-weight:800;border-radius:9px;padding:10px 15px}.muted{color:#94a3b8}</style></head><body class="min-h-screen">
<header class="border-b border-slate-800 px-5 py-4 flex justify-between items-center"><div><b class="text-xl tracking-wider">GIFTS-POWERS</b><div class="text-xs muted">礼蕴力量 · 内容与询价管理</div></div><button id="logout" class="hidden text-sm text-cyan-300">退出登录</button></header>
<main class="max-w-6xl mx-auto p-5">
<section id="login" class="panel max-w-md mx-auto mt-16 p-7"><h1 class="text-2xl font-bold mb-2">管理员登录</h1><p class="muted text-sm mb-5">使用 Supabase Authentication 管理员账号登录。</p><form id="login-form" class="space-y-3"><input class="field" type="email" name="email" placeholder="管理员邮箱" required><input class="field" type="password" name="password" placeholder="密码" required><button class="btn w-full">登录后台</button><p id="login-error" class="text-rose-400 text-sm"></p></form></section>
<section id="dashboard" class="hidden space-y-6">
<div class="flex flex-wrap gap-3 items-center justify-between"><div><h1 class="text-2xl font-bold">网站管理面板</h1><p class="muted text-sm">保存后，前台下次加载时自动读取最新内容。</p></div><span id="status" class="text-xs text-emerald-300"></span></div>
<section class="panel p-5"><h2 class="text-lg font-bold mb-4">站点内容设置</h2><form id="settings-form" class="grid md:grid-cols-2 gap-4"><label class="text-sm">品牌名称<input class="field mt-1" name="brand_name"></label><label class="text-sm">首页主标题<input class="field mt-1" name="hero_title"></label><label class="text-sm md:col-span-2">首页副标题<textarea class="field mt-1" rows="2" name="hero_subtitle"></textarea></label><label class="text-sm">联系邮箱<input class="field mt-1" name="contact_email"></label><label class="text-sm">联系电话<input class="field mt-1" name="contact_phone"></label><div class="md:col-span-2"><button class="btn">保存站点设置</button></div></form></section>
<section class="panel p-5"><h2 class="text-lg font-bold mb-4">3D 产品参数</h2><div id="products" class="grid md:grid-cols-3 gap-4"></div></section>
<section class="panel p-5"><div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold">客户询价</h2><button id="refresh" class="text-sm text-cyan-300">刷新列表</button></div><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="text-slate-400 border-b border-slate-700"><tr><th class="p-2">提交时间</th><th class="p-2">客户</th><th class="p-2">产品/数量</th><th class="p-2">联系方式</th><th class="p-2">状态</th><th class="p-2">操作</th></tr></thead><tbody id="inquiries"></tbody></table></div></section>
</section></main><script src="/config.js"></script><script src="/admin/admin.js"></script></body></html>
