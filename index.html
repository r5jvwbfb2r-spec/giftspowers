<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIFTS-POWERS 礼蕴力量 | 3D 营销礼品与展会物料定制平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { dark: '#070b14', panel: 'rgba(13, 20, 36, 0.75)', accent: '#00f2fe', purple: '#7928ca', cyan: '#4facfe' } }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #070b14; color: #f1f5f9; overflow-x: hidden; }
    .mono-font { font-family: 'JetBrains Mono', monospace; }
    .glass-panel { background: rgba(13, 20, 36, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .gradient-text { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7928ca 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 顶部导航栏 -->
  <header class="glass-panel border-b border-slate-800/80 sticky top-0 z-50 px-8 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
        <i class="fa-solid fa-cube text-xl"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-lg leading-none gradient-text tracking-wide">GIFTS-POWERS <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 ml-2">PRO</span></h1>
        <p class="text-[10px] text-slate-400 mt-1">礼蕴力量 // 3D 定制引擎</p>
      </div>
    </div>
    <div class="flex items-center gap-8 text-sm font-medium text-slate-300">
      <a href="#" class="text-cyan-400 hover:text-cyan-300 transition">3D 展厅</a>
      <a href="#catalog" class="hover:text-cyan-400 transition">产品目录</a>
      <a href="dashboard.html" target="_blank" class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-cyan-500/30 text-xs flex items-center gap-1.5 transition">
        <i class="fa-solid fa-gauge-high"></i> 运营管理后台
      </a>
    </div>
  </header>

  <!-- 主定制区 -->
  <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-12 gap-6 items-start">
    
    <!-- 左侧：3D 渲染画布区 -->
    <div class="col-span-8 glass-panel rounded-3xl p-6 relative overflow-hidden flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h2 id="model-title-display" class="text-xl font-bold text-slate-100">高级双层保温杯</h2>
          <p id="model-spec-display" class="text-xs text-slate-400 mt-0.5">SPEC: 304 STAINLESS STEEL / 500ML</p>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/80 p-1.5 rounded-xl border border-slate-800">
          <button onclick="setLightPreset('棚拍')" id="btn-light-棚拍" class="px-3 py-1 rounded-lg text-xs font-semibold bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 transition">棚拍</button>
          <button onclick="setLightPreset('霓虹')" id="btn-light-霓虹" class="px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition">霓虹</button>
          <button onclick="setLightPreset('暖光')" id="btn-light-暖光" class="px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition">暖光</button>
        </div>
      </div>

      <div id="canvas-container" class="w-full h-[460px] rounded-2xl relative bg-slate-950/60 border border-slate-900 overflow-hidden cursor-grab active:cursor-grabbing">
        <div class="absolute bottom-4 right-4 bg-slate-900/80 backdrop-blur border border-slate-800 px-3 py-1.5 rounded-lg text-[11px] text-slate-400 pointer-events-none">
          <i class="fa-solid fa-arrows-rotate mr-1"></i> 按住鼠标左键 360° 旋转 / 滚轮缩放
        </div>
      </div>

      <div class="flex items-center justify-between mt-5 pt-4 border-t border-slate-800/60 text-xs">
        <div class="flex items-center gap-2">
          <span class="text-slate-400 mr-2">物料模型:</span>
          <button onclick="switchModel('保温杯')" id="model-btn-保温杯" class="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold transition shadow-lg shadow-cyan-500/20">保温杯</button>
          <button onclick="switchModel('马克杯')" id="model-btn-马克杯" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">马克杯</button>
          <button onclick="switchModel('纪念币')" id="model-btn-纪念币" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">纪念币</button>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-slate-400">外观配色:</span>
          <div class="flex items-center gap-2">
            <span onclick="setMaterialColor('#00f2fe')" class="w-6 h-6 rounded-full bg-[#00f2fe] border-2 border-white ring-2 ring-cyan-500/50 cursor-pointer"></span>
            <span onclick="setMaterialColor('#7928ca')" class="w-6 h-6 rounded-full bg-[#7928ca] border border-slate-600 cursor-pointer"></span>
            <span onclick="setMaterialColor('#ffb703')" class="w-6 h-6 rounded-full bg-[#ffb703] border border-slate-600 cursor-pointer"></span>
            <span onclick="setMaterialColor('#ffffff')" class="w-6 h-6 rounded-full bg-[#ffffff] border border-slate-600 cursor-pointer"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：实时报价计算器 (读取后台数据) -->
    <div class="col-span-4 glass-panel rounded-3xl p-6 space-y-5">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="font-semibold text-slate-200 text-sm flex items-center gap-2">
          <i class="fa-solid fa-calculator text-cyan-400"></i> 参数报价计算器
        </h3>
        <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">后台数据实时联动</span>
      </div>

      <div class="space-y-4 text-xs">
        <div>
          <label class="text-slate-400 block mb-2 font-medium">定制起订量 (PCS): <span id="qty-text" class="text-cyan-400 font-bold mono-font">500</span> 件</label>
          <input type="range" id="qty-slider" min="50" max="5000" step="50" value="500" oninput="updatePricing()" class="w-full accent-cyan-400 cursor-pointer">
          <div class="flex justify-between text-[10px] text-slate-500 mt-1">
            <span id="moq-label">起订量: 50件</span>
            <span>1000件</span>
            <span>5000件+</span>
          </div>
        </div>

        <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-2.5">
          <div class="flex justify-between">
            <span class="text-slate-400">当前计算单价:</span>
            <span id="unit-price-display" class="mono-font font-bold text-slate-200">￥45.00 / 件</span>
          </div>
          <div class="flex justify-between">
            <span class="text-slate-400">预估生产周期:</span>
            <span class="text-slate-200">5-7 个工作日</span>
          </div>
        </div>

        <div class="pt-2 border-t border-slate-800 flex items-center justify-between">
          <div>
            <div class="text-[10px] text-slate-400">预估总预算 (TOTAL)</div>
            <div id="total-price-display" class="text-2xl font-extrabold text-cyan-400 mono-font mt-0.5">￥22,500</div>
          </div>
          <button onclick="submitInquiry()" class="px-5 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-xs hover:brightness-110 shadow-lg shadow-cyan-500/20 transition flex items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> 提交定制需求
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let savedModels = JSON.parse(localStorage.getItem('gp_models')) || [
      { name: '高级双层保温杯', spec: '304 STAINLESS STEEL / 500ML', moq: 50, price: 68, discountPrice: 45 },
      { name: '定制陶瓷马克杯', spec: 'HIGH-TEMP CERAMIC / 350ML', moq: 100, price: 38, discountPrice: 22 },
      { name: '高档金属纪念币', spec: 'ANTI-COUNTERFEIT RELIEF COIN', moq: 200, price: 85, discountPrice: 52 }
    ];
    let savedSiteConfig = JSON.parse(localStorage.getItem('gp_site_config')) || { model: '保温杯', light: '棚拍' };

    let currentModelType = savedSiteConfig.model || '保温杯';
    let currentLight = savedSiteConfig.light || '棚拍';
    let currentMatColor = 0x00f2fe;

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 2, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);
    const pointLight = new THREE.PointLight(0x00f2fe, 3, 10);
    pointLight.position.set(-3, 2, 3);
    scene.add(pointLight);

    function setLightPreset(preset) {
      currentLight = preset;
      ['棚拍', '霓虹', '暖光'].forEach(p => {
        const btn = document.getElementById('btn-light-' + p);
        if (p === preset) {
          btn.className = "px-3 py-1 rounded-lg text-xs font-semibold bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 transition";
        } else {
          btn.className = "px-3 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-slate-200 transition";
        }
      });
    }

    let currentMesh;
    function buildModel(type) {
      if (currentMesh) scene.remove(currentMesh);
      const group = new THREE.Group();

      if (type.includes('保温杯')) {
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.7, 2.5, 32), new THREE.MeshStandardMaterial({ color: currentMatColor, roughness: 0.3, metalness: 0.8 }));
        group.add(body);
        const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 0.82, 0.5, 32), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.2 }));
        lid.position.y = 1.35;
        group.add(lid);
      } else if (type.includes('马克杯')) {
        const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.75, 2.0, 32), new THREE.MeshStandardMaterial({ color: currentMatColor, roughness: 0.4 }));
        group.add(cup);
        const handle = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.1, 16, 32, Math.PI), new THREE.MeshStandardMaterial({ color: currentMatColor, roughness: 0.4 }));
        handle.rotation.z = Math.PI / 2;
        handle.position.set(0.9, 0, 0);
        group.add(handle);
      } else {
        const coin = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.2, 32), new THREE.MeshStandardMaterial({ color: currentMatColor, roughness: 0.2, metalness: 0.9 }));
        group.add(coin);
      }
      currentMesh = group;
      scene.add(currentMesh);
    }

    function switchModel(type) {
      currentModelType = type;
      ['保温杯', '马克杯', '纪念币'].forEach(t => {
        const btn = document.getElementById('model-btn-' + t);
        if (t === type) {
          btn.className = "px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold transition shadow-lg shadow-cyan-500/20";
        } else {
          btn.className = "px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
        }
      });

      const found = savedModels.find(m => m.name.includes(type));
      if (found) {
        document.getElementById('model-title-display').innerText = found.name;
        document.getElementById('model-spec-display').innerText = 'SPEC: ' + found.spec;
        document.getElementById('moq-label').innerText = '起订量: ' + found.moq + '件';
        document.getElementById('qty-slider').min = found.moq;
        document.getElementById('qty-slider').value = found.moq;
      }
      buildModel(type);
      updatePricing();
    }

    function setMaterialColor(hexStr) {
      currentMatColor = parseInt(hexStr.replace('#', '0x'));
      if (currentMesh) {
        currentMesh.children.forEach(child => {
          if (child.material && !child.material.color.equals(new THREE.Color(0x1e293b))) {
            child.material.color.setHex(currentMatColor);
          }
        });
      }
    }

    function updatePricing() {
      const qty = parseInt(document.getElementById('qty-slider').value);
      document.getElementById('qty-text').innerText = qty;

      const found = savedModels.find(m => m.name.includes(currentModelType)) || savedModels[0];
      let unitPrice = qty >= 500 ? found.discountPrice : found.price;
      let total = qty * unitPrice;

      document.getElementById('unit-price-display').innerText = '￥' + unitPrice.toFixed(2) + ' / 件';
      document.getElementById('total-price-display').innerText = '￥' + total.toLocaleString();
    }

    function submitInquiry() {
      const qty = document.getElementById('qty-slider').value;
      const total = document.getElementById('total-price-display').innerText;
      
      let orders = JSON.parse(localStorage.getItem('gp_orders')) || [];
      orders.unshift({
        id: Date.now(),
        client: '前台在线访客',
        project: document.getElementById('model-title-display').innerText + ' 定制需求',
        qty: Number(qty),
        price: Number(total.replace(/[^0-9.]/g, '')),
        status: '待核价报价'
      });
      localStorage.setItem('gp_orders', JSON.stringify(orders));
      alert('定制需求已成功提交至后台运营系统！');
    }

    setLightPreset(currentLight);
    switchModel(currentModelType);

    function animate() {
      requestAnimationFrame(animate);
      if (currentMesh) currentMesh.rotation.y += 0.003;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
